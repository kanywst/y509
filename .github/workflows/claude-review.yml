name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    # converted_to_draft is here to cancel, not to run. The job skips drafts, so
    # the run this starts exists only to take over the concurrency group and stop
    # a review of a pull request its author has just pulled back.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Dependabot is same-repo but
    # is handed dependabot secrets rather than the repository's, so it would fail
    # the token check and paint every dependency bump red; the type check keeps
    # every bot out for the same reason. Drafts are skipped until they are marked
    # ready, which is what the ready_for_review trigger is for.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Nothing here pushes, and the action authenticates through the GitHub
          # App rather than this token. Leaving the token in the workspace git
          # config only widens what the third-party action can reach.
          persist-credentials: false

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            y509 is a Go TUI for reading X.509 certificate chains, from a PEM or DER file, a
            live server (including STARTTLS for smtp, imap and postgres), or stdin.
            pkg/certificate is the only exported package and holds parsing, chain analysis
            and trust verification. internal/cmd is the cobra surface, internal/model is the
            Bubble Tea model, and `validate` is meant to be usable as a CI gate.

            Do not repeat what CI already does. golangci-lint, go vet, the tests and the 80%
            coverage gate run on this PR already.

            Look for what only a reader can catch:

            1. Evidence destroyed by sorting. Certificates are kept in the order the server
               sent them, because a mis-served chain is the main thing this tool exists to
               show. AnalyzeChain sorts on the way through and callers use its result rather
               than sorting again.

            2. Trust decisions. A chain that links up but terminates at a root supplied in
               its own input is self-anchored, not valid, and `validate` must keep exiting
               non-zero or it silently passes CI.

            3. Checks that quietly do nothing. A verification skipped, passing on empty
               input, or with its error swallowed. This is security-adjacent code, so weigh
               that above style.

            4. The exported surface. pkg/certificate is imported by others, so a signature
               change there is breaking.

            5. Test shape. Fixtures should be generated per run rather than committed,
               because committed certificates expire and noticing expiry is the job.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary, posted with
            `gh pr comment --edit-last --create-if-none` so that a re-review
            replaces the previous summary rather than stacking another one
            underneath it. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
