name: Demo

on:
  push:
    branches: [main]
    paths:
      - 'demo.tape'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'scripts/gen_demo_certs.go'
      - '.github/workflows/demo.yml'

permissions:
  contents: write

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ttyd
        run: |
          curl -L -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          chmod +x /tmp/ttyd
          sudo mv /tmp/ttyd /usr/local/bin/ttyd

      - name: Install vhs
        # Held at v0.11.0: v0.12.0 encodes nothing. It plays the whole tape,
        # prints "Creating demo.gif..." and exits 0 without writing the file,
        # on this runner and against ffmpeg 6 and 9 alike, so it is vhs rather
        # than the encoder. Revisit when a release renders again.
        #
        # GOTOOLCHAIN is scoped to this step because vhs can require a newer Go
        # than y509's own floor, and setup-go otherwise pins it to the go.mod
        # version for the whole job.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/charmbracelet/vhs@v0.11.0

      - name: Render demo.gif
        # vhs can print "Creating demo.gif..." and exit 0 having written
        # nothing, which is how v0.12.0 went unnoticed: the next step reads the
        # untouched file as "unchanged" and the job goes green while demo.gif
        # rots. Remove it first and inspect what comes back, rather than
        # comparing timestamps -- a half-encoded file has a fresh mtime too.
        run: |
          rm -f demo.gif
          vhs demo.tape
          if [ ! -s demo.gif ] ||
             [ "$(head -c 4 demo.gif)" != "GIF8" ] ||
             [ "$(tail -c 1 demo.gif)" != ";" ]; then
            echo "::error::vhs did not write a usable demo.gif"
            exit 1
          fi

      - name: Commit and push if demo.gif changed
        run: |
          if git diff --quiet -- demo.gif; then
            echo "demo.gif unchanged, nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo.gif
          git commit -m "chore(demo): refresh demo.gif"
          git push
