name: action

# Exercises action.yml against badssl.com, which maintains one endpoint per
# failure mode. The action installs a released binary, so this tests the action
# itself -- the download, the checksum, the gating -- not the working tree.
on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - ".github/workflows/action-test.yml"
  pull_request:
    paths:
      - "action.yml"
      - ".github/workflows/action-test.yml"
  # Re-run weekly. The endpoints are third party, and a certificate rotation
  # there should surface here rather than in someone else's workflow.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthy:
    name: a well-served chain passes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./
        with:
          target: badssl.com:443
          # Not "expiring": a third-party certificate will wander inside any
          # threshold eventually, and that is not this workflow's business.
          fail-on: untrusted,mis-served
      - name: the outputs describe a healthy chain
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.check.outputs.trust-level }}" = "trusted"
          test "${{ steps.check.outputs.trusted }}" = "true"
          test "${{ steps.check.outputs.presentation-ok }}" = "true"
          test -n "${{ steps.check.outputs.days-until-expiry }}"

  mis-served:
    name: a chain missing an intermediate fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This is the case the whole tool exists for: the chain verifies in a
      # browser and is still misconfigured, because the intermediate was never
      # sent. The step must fail, so its failure is the assertion.
      - id: check
        continue-on-error: true
        uses: ./
        with:
          target: incomplete-chain.badssl.com:443
          fail-on: mis-served
      - name: the step failed, and named the problem
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "expected the mis-served chain to fail the gate"; exit 1
          fi
          test "${{ steps.check.outputs.presentation-ok }}" = "false"
          case "${{ steps.check.outputs.problems }}" in
            *"missing issuer"*) ;;
            *) echo "expected a missing issuer finding, got: ${{ steps.check.outputs.problems }}"; exit 1 ;;
          esac

  untrusted:
    name: an expired chain fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        continue-on-error: true
        uses: ./
        with:
          target: expired.badssl.com:443
          fail-on: untrusted
      - name: the step failed, and the trust level says why
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "expected the expired chain to fail the gate"; exit 1
          fi
          test "${{ steps.check.outputs.trusted }}" = "false"

  spaced-list:
    name: a fail-on list written with spaces still gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # "untrusted, mis-served" is the natural way to write this in YAML. It
      # used to miss the second keyword, downgrading the gate to a warning and
      # passing the job.
      - id: check
        continue-on-error: true
        uses: ./
        with:
          target: incomplete-chain.badssl.com:443
          fail-on: untrusted, mis-served
      - name: the spaced list still failed the job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "a fail-on list with spaces did not gate"; exit 1
          fi

  bad-keyword:
    name: an unknown fail-on keyword is refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A typo must not read as "gate nothing".
      - id: check
        continue-on-error: true
        uses: ./
        with:
          target: badssl.com:443
          fail-on: untrusted,mis-servd
      - name: the typo failed the step
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "an unknown keyword was accepted"; exit 1
          fi

  policy-without-input:
    name: fail-on policy without a policy is refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A local certificate, so nothing but the guard can fail the step.
      - name: generate a certificate
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout /dev/null -days 7 -subj "/CN=policy.test" \
            -addext "subjectAltName=DNS:policy.test" -out policy-test.pem
      # The same certificate passes without the keyword, so install and run work.
      - uses: ./
        with:
          target: policy-test.pem
          roots: policy-test.pem
          fail-on: none
      - id: check
        continue-on-error: true
        uses: ./
        with:
          target: policy-test.pem
          roots: policy-test.pem
          fail-on: untrusted,policy
      - name: the step failed before y509 ran
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "fail-on policy passed with no policy to judge"; exit 1
          fi
          test -z "${{ steps.check.outputs.trust-level }}"

  policy-gate:
    name: fail-on policy fails only a chain FIPS rejects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # RSA exponent 3 verifies everywhere except in FIPS mode.
      - name: generate certificates
        run: |
          openssl req -x509 -newkey rsa:2048 -pkeyopt rsa_keygen_pubexp:3 -nodes \
            -keyout /dev/null -days 7 -subj "/CN=exponent3.test" \
            -addext "subjectAltName=DNS:exponent3.test" -out exponent3.pem
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout /dev/null -days 7 -subj "/CN=p256.test" \
            -addext "subjectAltName=DNS:p256.test" -out p256.pem
      - id: clean
        uses: ./
        with:
          target: p256.pem
          roots: p256.pem
          policy: fips
          fail-on: untrusted,policy
      - id: check
        continue-on-error: true
        uses: ./
        with:
          target: exponent3.pem
          roots: exponent3.pem
          policy: fips
          fail-on: untrusted,policy
      - name: only the exponent-3 chain failed, and on the policy
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.clean.outputs.policy-ok }}" = "true"
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "expected the exponent-3 chain to fail the policy gate"; exit 1
          fi
          test "${{ steps.check.outputs.trust-level }}" = "trusted"
          test "${{ steps.check.outputs.policy-ok }}" = "false"

  report-only:
    name: fail-on none never fails the job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./
        with:
          target: incomplete-chain.badssl.com:443
          fail-on: none
      - name: the finding is still reported
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.check.outputs.presentation-ok }}" = "false"
