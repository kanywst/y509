name: Release

on:
  push:
    tags:
      # Only real version tags. The bare 'v1' that the GitHub Action points at
      # is moved on every release, and 'v*' matched it: goreleaser then ran a
      # second time against the same commit, rebuilt with a new timestamp, and
      # replaced the artifacts of the release it had just published. The
      # cosign-signed checksums were replaced along with them, so anyone who
      # had already recorded a hash saw it stop matching.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  # Required for cosign keyless signing via GitHub OIDC
  id-token: write
  # Required for actions/attest-build-provenance to record SLSA provenance
  attestations: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # SLSA build provenance for the release archives and packages.
      # Verify with: gh attestation verify <artifact> -R kanywst/y509
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
